version: 2

sources:

  - name: silver
    schema: silver
    database: "{{ env_var('DBT_ENVIRONMENTS') }}_SILVER_ICAROSPATH_DB"

    quoting:
      database: false
      schema: false
      identifier: false
    

    freshness:
      warn_after: {count: 10, period: day}
      error_after: {count: 20, period: day}

    tables:
      - name: listenings
        config:
          event_time: _fivetran_synced
          loaded_at_field: _fivetran_synced
        description: "Listening habits of the users"
        columns:
          - name: _row
            data_type: int
            description: "Number of each row in the Google Sheet"
          - name: listening_id
            data_type: varchar
            description: "Identificator for a listening made by a user"
          - name: uri
            data_type: varchar
            description: "Track URI to identify it in Spotify"
          - name: ts
            data_type: timestamp_ntz
            description: "Date and time in which the listening was done"
          - name: platform
            data_type: varchar
            description: "Platform in which the listening took place"
          - name: ms_played
            data_type: int
            description: "Miliseconds that the listening lasted"
          - name: track_name
            data_type: varchar
            description: "Name of the track"
          - name: artist_name
            data_type: varchar
            description: "Name of the main artist that made the song"
          - name: album_name
            data_type: varchar
            description: "Name of the album that the song belongs to"
          - name: reason_start
            data_type: varchar
            description: "Why the track started playing"
          - name: reason_end
            data_type: varchar
            description: "Why the track stopped playing"
          - name: shuffle
            data_type: boolean
            description: "Wether, in the beginning of the listening, shuffle was activated"
          - name: skipped
            data_type: boolean
            description: "Wether the track was skipped"
          - name: hashed_user_id
            data_type: varchar
            description: "Hashed id of the user that listened to the track"
          - name: date_load
            data_type: timestamp_ntz
            description: "Date when the data was loaded in Snowflake"

      - name: tracks
        config:
          event_time: _fivetran_synced
          loaded_at_field: _fivetran_synced
        description: "Data corresponding to tracks"
        columns: 
          - name: _row
            data_type: int
            description: "Number of each row in the Google Sheet"
          - name: uri
            data_type: varchar
            description: "Track URI to identify it in Spotify"
          - name: track_name
            data_type: varchar
            description: "Name of the track"
          - name: _fivetran_synced
            data_type: timestamp_ntz
            description: "Date when the data was loaded in Snowflake"

      - name: albums
        config:
          event_time: _fivetran_synced
          loaded_at_field: _fivetran_synced
        description: "Data corresponding to albums, EPs and singles"
        columns: 
          - name: _row
            data_type: int
            description: "Number of each row in the Google Sheet"
          - name: album_id
            data_type: varchar
            description: "Identifier for an album"
          - name: album_name
            data_type: varchar
            description: "Name of the album"
          - name: _fivetran_synced
            data_type: timestamp_ntz
            description: "Date when the data was loaded in Snowflake"
      
      - name: artists
        config:
          event_time: _fivetran_synced
          loaded_at_field: _fivetran_synced
        description: "Data corresponding to artists"
        columns: 
          - name: _row
            data_type: int
            description: "Number of each row in the Google Sheet"
          - name: artist_id
            data_type: varchar
            description: "Identifier for an artist"
          - name: artist_name
            data_type: varchar
            description: "Name of the artist"
          - name: _fivetran_synced
            data_type: timestamp_ntz
            description: "Date when the data was loaded in Snowflake"
      
      - name: users
        description: "Data corresponding to users"                          # Since users are hardcoded, their values should not be checked for freshness
        columns:                                                            # Again, in a real case, this information would most likely come from the sources,
            - name: original_id                                             # and be treated like the rest of the tables (since it would have a column to track this)
              data_type: varchar
              description: "Identifier for a user"
              tests:
                - unique
                - not_null
                - accepted_user_ids
            - name: hashed_id
              data_type: varchar
              description: "Hashed identifier for a user"
              tests:
                - not_null
                - unique
            - name: username
              data_type: varchar
              description: "Username used in the platform by the user"
              tests:
                - not_null
                - unique
            - name: name
              data_type: varchar
              description: "Full name of the user"
              tests:
                - not_null
            - name: email
              data_type: varchar
              description: "Email used by the user in the platform"
              tests:
                - not_null
                - unique
            
