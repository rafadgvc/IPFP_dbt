version: 2

sources:

  - name: kaggle
    schema: kaggle
    database: "{{ env_var('DBT_ENVIRONMENTS') }}_BRONZE_ICAROSPATH_DB"

    quoting:
      database: false
      schema: false
      identifier: false
    

    freshness:
      warn_after: {count: 10, period: day}
      error_after: {count: 20, period: day}

    tables:
      - name: history
        description: "History of the first user's listening habits"
        columns:
          - name: spotify_track_uri
            data_type: varchar
            description: "Track URI to identify it in Spotify"
          - name: ts
            data_type: timestamp_ntz
            description: "Date and time in which the listening was done"
          - name: platform
            data_type: varchar
            description: "Platform in which the listening took place"
          - name: ms_played
            data_type: varchar
            description: "Miliseconds that the listening lasted"
          - name: track_name
            data_type: varchar
            description: "Name of the track"
          - name: artist_name
            data_type: varchar
            description: "Name of the main artist that made the song"
          - name: album_name
            data_type: varchar
            description: "Name of the album that the song belongs to"
          - name: reason_start
            data_type: varchar
            description: "Why the track started playing"
          - name: reason_end
            data_type: varchar
            description: "Why the track stopped playing"
          - name: shuffle
            data_type: boolean
            description: "Wether, in the beginning of the listening, shuffle was activated"
          - name: skipped
            data_type: boolean
            description: "Wether the track was skipped"

      - name: songs_data
        description: "Data corresponding to tracks"
        columns:
          - name: valence
            data_type: varchar
            description: "How positive the track is"
          - name: year
            data_type: varchar
            description: "Year in which the track was released"
          - name: acousticness
            data_type: varchar
            description: "How acoustic the track is"
          - name: artists
            data_type: varchar
            description: "Artists credited to the track"
          - name: danceability
            data_type: varchar
            description: "How danceable the track is"
          - name: duration_ms
            data_type: varchar
            description: "Duration of the track in miliseconds"
          - name: energy
            data_type: varchar
            description: "How energetic the track is"
          - name: explicit
            data_type: varchar
            description: "Wether the track contains explicit content"
          - name: id
            data_type: varchar
            description: "Track URI to identify it in Spotify"
          - name: instrumentalness
            data_type: varchar
            description: "How instrumental the track is"
          - name: key
            data_type: varchar
            description: "Key in which the track is created"
          - name: liveness
            data_type: varchar
            description: "How much audience the track is"
          - name: loudness
            data_type: varchar
            description: "How loud the track is"
          - name: mode
            data_type: varchar
            description: "Wether the track is in major or minor"
          - name: name
            data_type: varchar
            description: "Name of the track"
          - name: popularity
            data_type: varchar
            description: "How popular the track is"
          - name: realease_date
            data_type: varchar
            description: "Date in which the track was released"
          - name: speechiness
            data_type: varchar
            description: "How much presence of spoken words the track has"
          - name: tempo
            data_type: varchar
            description: "Tempo of the track"
