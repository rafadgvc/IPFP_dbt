version: 2


models: 
  - name: fct_listenings
    columns: 
      - name: uri
        tests: 
          - not_null
      - name: date_id
        tests: 
          - not_null
      - name: time_id
        tests: 
          - not_null
      - name: id_platform
        tests: 
          - not_null
      - name: ms_played
        tests: 
          - not_null
      - name: id_reason_start
        tests: 
          - not_null
      - name: id_reason_end
        tests: 
          - not_null
      - name: shuffle
        tests: 
          - not_null
      - name: skipped
        tests: 
          - not_null
      - name: hashed_user_id
        tests: 
          - not_null

  - name: dim_why_started
    columns: 
      - name: id_reason_start
        tests: 
          - not_null
          - unique
      - name: reason_start
        tests: 
          - not_null
          - unique

  - name: dim_why_ended
    columns: 
      - name: id_reason_end
        tests: 
          - not_null
          - unique
      - name: reason_end
        tests: 
          - not_null
          - unique

  - name: dim_who
    columns: 
      - name: original_id
        tests: 
          - not_null
          - unique
      - name: hashed_id
        tests: 
          - not_null
          - unique
      - name: username
        tests: 
          - not_null
      - name: name
        tests: 
          - not_null
      - name: email
        tests: 
          - not_null

  - name: dim_where
    columns: 
      - name: id_platform
        tests: 
          - not_null
          - unique
      - name: platform
        tests: 
          - not_null
          - unique

  - name: dim_when_time
    columns: 
      - name: time_id
        tests: 
          - not_null
          - unique
      - name: hour
        tests: 
          - not_null
      - name: minute
        tests: 
          - not_null
      - name: formatted_time
        tests: 
          - not_null
      - name: moment_of_day
        tests: 
          - not_null

  - name: dim_when_date
    columns: 
      - name: date_id
        tests: 
          - not_null
          - unique
      - name: year
        tests: 
          - not_null
      - name: month
        tests: 
          - not_null
      - name: month_name
        tests: 
          - not_null
      - name: day
        tests: 
          - not_null
      - name: number_week_day
        tests: 
          - not_null
      - name: week_day
        tests: 
          - not_null
      - name: quarter
        tests: 
          - not_null

  - name: dim_what
    columns: 
      - name: track_name
        tests: 
          - not_null
      - name: track_id
        tests: 
          - not_null
          - unique
      - name: album_name
        tests: 
          - not_null
      - name: album_id
        tests: 
          - not_null
      - name: artist_name
        tests: 
          - not_null
      - name: artist_id
        tests: 
          - not_null
    