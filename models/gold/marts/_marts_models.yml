version: 2


models: 
  - name: users_listened_minutes_by_month
    columns: 
      - name: username
        tests:
          - not_null
      - name: year
        tests:
          - not_null
          - positive_values
      - name: month
        tests:
          - not_null
          - positive_values
      - name: total_listened_minutes
        tests:
          - not_null
          - positive_values
  - name: users_listenings_by_month
    columns: 
      - name: username
        tests:
          - not_null
      - name: year
        tests:
          - not_null
          - positive_values
      - name: month
        tests:
          - not_null
          - positive_values
      - name: total_listenings
        tests:
          - not_null
          - positive_values